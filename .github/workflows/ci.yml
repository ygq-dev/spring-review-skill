name: ci

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Show toolchain
        run: |
          java -version
          mvn -version

      - name: Build (skip tests)
        run: mvn -q -B -DskipTests package

      - name: Unit and integration tests
        run: mvn -q -B test
        env:
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8

      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: spring-review-skill-jar
          path: target/spring-review-skill-*.jar
          if-no-files-found: error
          retention-days: 14