    date: "2026-09-24"
    description: "B5 初始规则元数据。"
test_cases: []
coverage: "覆盖 Java 17+/Spring Boot 3.x、Maven/Gradle 项目中 InputStream/Connection 未关闭检测；不覆盖框架托管资源、连接池内部实现与测试代码。"
