rule_id: "SRS-SEC-02-001"
name: "日志输出敏感信息"
description: "通过正则扫描日志语句和日志配置，检测输出密码、token、身份证、银行卡、手机号等敏感信息，或记录完整请求体/响应体。"
category_l1: "SEC"
category_l2: "02"
status: "ACTIVE"
severity: "CRITICAL"
confidence: "HIGH"
detection_method: "REGEX"
tool: "CUSTOM"
parameters:
  patterns:
    - '(?i)log\.(info|debug|warn|error|trace)\s*\([^)]*\b(password|passwd|token|idCard|cardNo)\b'
enabled: true
applies_to:
  java_version: "17+"
  spring_boot_version: "3.x"
  build_tool:
    - maven
    - gradle
  module_type:
    - all
  framework:
    - spring-boot
  exclude: []
message: "日志不得输出敏感信息或完整凭据。"
remediation: "脱敏后记录，使用日志白名单字段，避免打印请求体、响应体和认证头。"
positive_example: "日志仅记录脱敏标识或非敏感摘要。"
negative_example: "日志直接打印密码、token、完整请求体或认证头。"
false_positive_notes: "若变量名含敏感词但实际为脱敏值或测试假值，可忽略。"
sources:
  - type: "INTERNAL_EXPERIENCE"
    ref: "内部日志安全规范"
    version: "1.0"
  - type: "OFFICIAL_SPEC"
    ref: "OWASP ASVS 5.0 V7"
    version: "5.0"
coverage: "扫描日志调用、占位符参数和日志配置文件中的敏感字段。"
rule_version: "1.0.0"
metadata_version: "1.0.0"
schema_version: "1.0.0"
owner: "spring-review-skill"
created_at: "2026-09-24"
updated_at: "2026-09-24"
change_log:
  - version: "1.0.0"
    date: "2026-09-24"
    description: "初始版本。"
test_cases: []
