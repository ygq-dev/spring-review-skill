rule_id: "SRS-SEC-01-001"
name: "硬编码密钥/密码/token"
description: "通过正则扫描源码、配置和资源文件，检测硬编码密码、密钥、token、API key 等敏感凭据。"
category_l1: "SEC"
category_l2: "01"
status: "ACTIVE"
severity: "BLOCKER"
confidence: "HIGH"
detection_method: "REGEX"
tool: "CUSTOM"
parameters:
  patterns:
    - '(?i)\b(password|passwd|pwd|secret|api[_-]?key|apikey|token|access[_-]?key)\b\s*=\s*"[^"]{3,}"'
enabled: true
applies_to:
  java_version: "17+"
  spring_boot_version: "3.x"
  build_tool:
    - maven
    - gradle
  module_type:
    - all
  framework:
    - spring-boot
  exclude: []
message: "禁止硬编码密钥、密码或 token。"
remediation: "改用环境变量、密钥管理服务、Spring Config 加密或外部化配置，并轮换已泄露凭据。"
positive_example: "敏感凭据从环境变量或密钥管理服务读取。"
negative_example: "源码或配置中直接写入密码、token、API key。"
false_positive_notes: "测试固定假值、示例占位符或已明确标记的非敏感常量可忽略。"
sources:
  - type: "INTERNAL_EXPERIENCE"
    ref: "内部安全编码基线"
    version: "1.0"
  - type: "OFFICIAL_SPEC"
    ref: "OWASP ASVS 5.0 V6"
    version: "5.0"
coverage: "扫描 Java、YAML、properties、XML 等文件中的凭据模式。"
rule_version: "1.0.0"
metadata_version: "1.0.0"
schema_version: "1.0.0"
owner: "spring-review-skill"
created_at: "2026-09-24"
updated_at: "2026-09-24"
change_log:
  - version: "1.0.0"
    date: "2026-09-24"
    description: "初始版本。"
test_cases: []
