rule_id: SRS-CF-02-001
name: "@Value 缺少默认值或配置校验"
description: |
  检测 @Value 注入缺少默认值或未使用 @ConfigurationProperties 校验。
  检测方式：AST 分析注解与参数。
  边界：必填配置显式失败可接受；非 Spring 管理类不报。
category_l1: CF
category_l2: "02"
tags:
  - config
  - configuration-properties
  - validation
status: ACTIVE
severity: MAJOR
confidence: MEDIUM
detection_method: AST
tool: CUSTOM
parameters:
  annotations:
    - "@Value"
  require_default: false
  require_validation: true
enabled: true
applies_to:
  java_version: "17+"
  spring_boot_version: "3.x"
  build_tool:
    - maven
    - gradle
  module_type:
    - web
    - api
    - batch
    - cloud
  framework:
    - spring-boot
    - spring-context
  exclude:
    - "**/test/**"
message: "@Value 注入 {field} 缺少默认值或配置校验。"
remediation: "使用 @ConfigurationProperties + @Validated，或为 @Value 提供默认值并校验。"
positive_example: |
  配置属性类使用 @ConfigurationProperties 和校验注解。
negative_example: |
  @Value("${app.timeout}") 无默认值且无校验。
false_positive_notes: "启动时快速失败是合理设计；仅当缺少校验导致运行时错误时告警。"
sources:
  - type: FRAMEWORK_DOC
    ref: "Spring Boot Externalized Configuration"
    version: "3.x"
rule_version: "1.0.0"
metadata_version: "1.0.0"
schema_version: "1.0.0"
owner: "config-team"
created_at: "2026-09-23"
updated_at: "2026-09-23"
change_log:
  - version: "1.0.0"
    date: "2026-09-23"
    description: "初始版本"
test_cases: []
coverage: "AST 扫描 @Value 与配置属性类"
