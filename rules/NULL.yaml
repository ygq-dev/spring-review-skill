  - version: "1.0.0"
    date: "2026-09-24"
    description: "初始规则元数据"
test_cases: []
coverage: "覆盖数组返回 null 的 SpotBugs 可识别模式，以及集合返回 null 的静态 AST 返回路径模式；不覆盖运行期动态代理和反射生成返回值。"
