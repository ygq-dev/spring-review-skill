rule_id: SRS-AR-02-001
name: 领域层依赖 Web/基础设施
description: |
  检测领域层（domain/model）依赖 Web 或基础设施包。
  领域层应保持隔离，仅依赖领域模型和抽象端口。
  检测方式：JavaParser 解析包/类依赖图，结合命名与注解做 HYBRID 判定。
  边界：应用服务、适配器不在领域层范围内。
category_l1: AR
category_l2: "02"
tags:
  - architecture
  - domain-isolation
status: ACTIVE
severity: MAJOR
confidence: HIGH
detection_method: HYBRID
tool: CUSTOM
parameters:
  layers:
    - Domain
    - Web
    - Infrastructure
  forbidden_dependencies:
    - web
    - infrastructure
enabled: true
applies_to:
  java_version: "17+"
  spring_boot_version: "3.x"
  build_tool:
    - maven
    - gradle
  module_type:
    - all
  framework:
    - spring
    - spring-boot
  exclude:
    - "**/test/**"
message: "领域层 {className} 依赖 {targetPackage}，违反领域隔离。"
remediation: "通过接口/端口反转依赖，将 Web 与基础设施实现放在外层。"
positive_example: |
  领域类仅依赖领域模型和抽象端口。
negative_example: |
  领域类导入 Web 注解或基础设施实现。
false_positive_notes: "框架必需的注解若无法避免，可限定到特定包；需人工复核。"
