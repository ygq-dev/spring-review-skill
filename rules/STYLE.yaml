created_at: "2026-09-24"
updated_at: "2026-09-24"
change_log:
  - version: "1.0.0"
    date: "2026-09-24"
    description: "初始规则元数据"
test_cases: []
coverage: "覆盖 Java 包、类型、方法、成员、常量、局部变量和参数的命名约定；不覆盖架构分层命名和业务语义命名质量。"
