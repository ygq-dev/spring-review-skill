  - version: "1.0.0"
    date: "2026-09-24"
    description: "初始规则元数据"
test_cases: []
coverage: "覆盖 @SpringBootTest、@DataJpaTest、@Testcontainers 等测试中直接连接真实外部服务或数据库的静态可识别模式；不覆盖动态反射、运行期条件化连接和外部配置解析后的实际连接。"
