rule_id: SRS-BUILD-02-001
name: SNAPSHOT 依赖进入生产构建
description: |
  检测生产构建依赖中包含 SNAPSHOT 版本。
  检测方式：正则扫描 Maven/Gradle 构建文件与锁文件。
  边界：开发分支和测试构建可豁免。
category_l1: BUILD
category_l2: "02"
tags:
  - build
  - release
  - dependency-version
status: ACTIVE
severity: CRITICAL
confidence: HIGH
detection_method: REGEX
tool: CUSTOM
parameters:
  pattern: '-SNAPSHOT'
enabled: true
applies_to:
  java_version: "17+"
  spring_boot_version: "3.x"
  build_tool:
    - maven
    - gradle
  module_type:
    - web
    - api
    - batch
    - cloud
    - all
  framework:
    - spring-boot
  exclude:
    - "**/test/**"
    - "**/build/dev/**"
message: "生产构建声明了 SNAPSHOT 依赖 {dependency}。"
remediation: "替换为固定 release 版本，或通过发布流程冻结快照。"
positive_example: |
  生产构建仅使用已发布版本。
negative_example: |
  pom.xml 中依赖版本以 -SNAPSHOT 结尾。
false_positive_notes: "仅开发 profile 或内部快照仓库可人工豁免。"
sources:
  - type: INTERNAL_EXPERIENCE
    ref: "发布构建规范"
    version: "1.0.0"
