updated_at: "2026-09-24"
change_log:
  - version: "1.0.0"
    date: "2026-09-24"
    description: "B5 初始规则元数据。"
test_cases: []
coverage: "覆盖 Java 17+/Spring Boot 3.x、Maven/Gradle 项目中 catch 块仅 printStackTrace 的检测；不覆盖日志框架内部实现与测试代码。"
